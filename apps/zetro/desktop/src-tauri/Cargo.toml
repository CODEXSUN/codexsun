[package]
name = "zetro-desktop"
version = "0.1.31"
description = "Zetro Windows desktop application"
authors = ["CODEXSUN"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rand = "0.9"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
