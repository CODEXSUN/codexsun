# Replace client.example and certificate paths for this client. Node binds to loopback.
server {
  listen 80;
  server_name client.example;
  return 301 https://client.example$request_uri;
}
server {
  listen 443 ssl;
  server_name client.example;
  ssl_certificate /etc/letsencrypt/live/client.example/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/client.example/privkey.pem;
  client_max_body_size 16k;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
