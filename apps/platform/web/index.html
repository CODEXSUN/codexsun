<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codexsun | Dashboard</title>
    <script>
      if (location.pathname === "/") document.documentElement.dataset.publicHome = "true";
    </script>
    <style>
      #public-home-shell {
        display: none;
      }
      html[data-public-home] #public-home-shell {
        display: block;
        min-height: 100vh;
        background: #fbfcfe;
        color: #102039;
        font-family: Inter, Arial, sans-serif;
      }
      #public-home-shell * {
        box-sizing: border-box;
      }
      #public-home-shell a {
        color: inherit;
        text-decoration: none;
      }
      #public-home-shell nav {
        align-items: center;
        background: #f8fafc;
        border-bottom: 1px solid rgba(27, 45, 73, 0.12);
        display: flex;
        justify-content: space-between;
        min-height: 78px;
        padding: 0 clamp(22px, 5vw, 80px);
      }
      #public-home-shell .brand {
        align-items: center;
        display: flex;
        gap: 12px;
      }
      #public-home-shell .brand img {
        height: 32px;
        width: 38px;
      }
      #public-home-shell .brand span {
        display: grid;
        gap: 1px;
      }
      #public-home-shell .brand strong {
        font-size: 14px;
      }
      #public-home-shell .brand small {
        color: #657187;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #public-home-shell .menu {
        display: flex;
        gap: 30px;
      }
      #public-home-shell .menu a {
        color: #536078;
        font-size: 13px;
      }
      #public-home-shell .login {
        background: #102039;
        border-radius: 999px;
        color: #fff;
        font-size: 12px;
        font-weight: 650;
        padding: 11px 17px;
      }
      #public-home-shell .hero {
        align-items: center;
        display: grid;
        gap: clamp(36px, 4vw, 58px);
        grid-template-columns: minmax(0, 0.95fr) minmax(500px, 1.05fr);
        min-height: 620px;
        margin: 0 auto;
        max-width: 1480px;
        padding: 34px clamp(24px, 5vw, 80px);
      }
      #public-home-shell .eyebrow {
        color: #2f6fed;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      #public-home-shell h1 {
        background: linear-gradient(115deg, #102039 4%, #2f6fed 58%, #7254c7 100%);
        background-clip: text;
        color: transparent;
        font-size: clamp(44px, 4vw, 64px);
        letter-spacing: -0.062em;
        line-height: 0.98;
        margin: 22px 0;
        max-width: 680px;
      }
      #public-home-shell .description {
        color: #657187;
        font-size: clamp(16px, 1.3vw, 19px);
        line-height: 1.55;
        max-width: 620px;
      }
      #public-home-shell figure {
        height: 520px;
        margin: 0;
        overflow: hidden;
        position: relative;
      }
      #public-home-shell figure img {
        display: block;
        height: 100%;
        object-fit: cover;
        width: 100%;
      }
      @media (max-width: 1050px) {
        #public-home-shell .menu {
          display: none;
        }
        #public-home-shell .hero {
          gap: 36px;
          grid-template-columns: 1fr;
          padding-block: 60px;
        }
        #public-home-shell figure {
          height: min(68vw, 620px);
        }
      }
      @media (max-width: 720px) {
        #public-home-shell nav {
          min-height: 68px;
          padding-inline: 18px;
        }
        #public-home-shell .brand small {
          display: none;
        }
        #public-home-shell .hero {
          padding-top: 58px;
        }
        #public-home-shell h1 {
          font-size: clamp(38px, 11vw, 50px);
        }
        #public-home-shell figure {
          height: min(76vw, 400px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="public-home-shell">
        <nav aria-label="CODEXSUN product navigation">
          <a class="brand" href="/" aria-label="CODEXSUN home">
            <img id="public-home-logo" alt="" width="38" height="32" />
            <span><strong>CODEXSUN</strong><small>Business Operating Platform</small></span>
          </a>
          <div class="menu">
            <a href="/workspace">Product</a><a href="/features">Features</a>
            <a href="/security">Security</a><a href="/blog">Blog</a><a href="/updates">Updates</a>
          </div>
          <a class="login" href="/login">Log in</a>
        </nav>
        <main class="hero">
          <div>
            <span class="eyebrow">CODEXSUN business operating platform</span>
            <h1>One clear system for every moving part.</h1>
            <p class="description">
              Connect daily operations, money, records, and people without adding more disconnected
              tools.
            </p>
          </div>
          <figure>
            <img
              id="public-home-hero-image"
              alt="A connected business desk for billing, reporting, dispatch, and product work"
              width="1080"
              height="860"
              fetchpriority="high"
            />
          </figure>
        </main>
      </div>
    </div>
    <script>
      if (document.documentElement.dataset.publicHome) {
        document.getElementById("public-home-logo").src = "/logo/logo.svg";
        document.getElementById("public-home-hero-image").src =
          "/marketing/codexsun-product-desk.jpg";
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
