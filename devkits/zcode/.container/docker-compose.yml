name: ${ZCODE_PROJECT_NAME:-zcode-codex}

services:
  prepare:
    image: gitpod/openvscode-server@sha256:5e7b8750749f282940a799ed59ccd02fac698ef6744f9113ac01c0ef8e76485e
    entrypoint: ["sh", "/opt/zcode-prepare.sh"]
    user: root
    working_dir: /home/workspace
    volumes:
      - workspace-data:/home/workspace
      - ./zcode-prepare.sh:/opt/zcode-prepare.sh:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    pids_limit: 64
    mem_limit: 512m
    cpus: 1

  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    volumes:
      - workspace-data:/workspace
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1

  editor:
    build:
      context: .
      dockerfile: Editor.Dockerfile
    init: true
    working_dir: /home/workspace
    environment:
      HOME: /home/openvscode-server
      ZBROWSER_MANAGER_URL: http://zbrowser:3001
      ZCODE_PREVIEW_PUBLIC_HOST: ${ZCODE_PREVIEW_PUBLIC_HOST:-127.0.0.1}
      ZCODE_PREVIEW_PUBLIC_SCHEME: ${ZCODE_PREVIEW_PUBLIC_SCHEME:-http}
      ZCODE_PREVIEW_URL_TEMPLATE: ${ZCODE_PREVIEW_URL_TEMPLATE:-}
    volumes:
      - workspace-data:/home/workspace
      - editor-home:/home/openvscode-server
    depends_on:
      prepare:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${ZCODE_EDITOR_PORT:-6132}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 15m
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 4g
    cpus: 2

  zbrowser:
    image: node:22-bookworm-slim
    init: true
    user: node
    working_dir: /workspace/codexsun
    command: ["node", "/opt/zbrowser/server.mjs"]
    environment:
      ZBROWSER_WORKSPACE: /workspace/codexsun
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${ZCODE_PREVIEW_ALLOWED_HOST:-.tmnext.in}
      ZBROWSER_UIUX_PORT: ${ZCODE_ZBROWSER_PORT:-6133}
      ZBROWSER_ZETRO2_PORT: ${ZCODE_ZETRO2_PREVIEW_PORT:-6155}
      ZBROWSER_PUBLIC_PORTS: ${ZCODE_PREVIEW_PORT_1:-6140},${ZCODE_PREVIEW_PORT_2:-6141},${ZCODE_PREVIEW_PORT_3:-6142},${ZCODE_PREVIEW_PORT_4:-6143},${ZCODE_PREVIEW_PORT_5:-6144},${ZCODE_PREVIEW_PORT_6:-6145},${ZCODE_PREVIEW_PORT_7:-6146},${ZCODE_PREVIEW_PORT_8:-6147},${ZCODE_PREVIEW_PORT_9:-6148}
    volumes:
      - workspace-data:/workspace
      - ./zbrowser:/opt/zbrowser:ro
    depends_on:
      editor:
        condition: service_healthy
    ports:
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_ZBROWSER_PORT:-6133}:${ZCODE_ZBROWSER_PORT:-6133}"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_ZETRO2_PREVIEW_PORT:-6155}:6155"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_1:-6140}:6140"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_2:-6141}:6141"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_3:-6142}:6142"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_4:-6143}:6143"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_5:-6144}:6144"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_6:-6145}:6145"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_7:-6146}:6146"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_8:-6147}:6147"
      - "${ZCODE_PREVIEW_BIND_HOST:-127.0.0.1}:${ZCODE_PREVIEW_PORT_9:-6148}:6148"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    mem_limit: 4g
    cpus: 2

volumes:
  editor-home:
  workspace-data:
