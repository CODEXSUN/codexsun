name: cx-agentcrew
services:
  ollama:
    container_name: cx-agentcrew-ollama
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    volumes: [ollama-models:/root/.ollama]
    environment:
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 2
      OLLAMA_MAX_QUEUE: 8
    restart: unless-stopped
    mem_limit: 8g
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 10s
      retries: 5
  qdrant:
    container_name: cx-agentcrew-qdrant
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
    mem_limit: 1g
  api:
    container_name: cx-agentcrew-api
    image: cx-agentcrew-api:local
    build:
      context: ../../../..
      dockerfile: devkits/agentcrew/ollama/.container/Dockerfile
      target: api
    environment:
      AGENTCREW_TOKEN: ${AGENTCREW_TOKEN:?Set a random access token of at least 32 characters}
      AGENTCREW_PORT: 6410
      AGENTCREW_MODEL: ${AGENTCREW_MODEL:-qwen3:4b}
      AGENTCREW_EMBED_MODEL: ${AGENTCREW_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_URL: http://ollama:11434
      QDRANT_URL: http://qdrant:6333
    volumes: [assistant-data:/workspace/storage/apps/private/agentcrew/assistant]
    depends_on:
      ollama: { condition: service_healthy }
      qdrant: { condition: service_started }
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:6410/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  web:
    container_name: cx-agentcrew-web
    image: cx-agentcrew-web:local
    networks:
      default:
      codexsun-network:
        aliases: [cx-agentcrew-web]
    build:
      context: ../../../..
      dockerfile: devkits/agentcrew/ollama/.container/Dockerfile
      target: web
    ports: ["127.0.0.1:${AGENTCREW_WEB_PORT:-6411}:8080"]
    depends_on:
      api: { condition: service_healthy }
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 256m
volumes:
  ollama-models:
    name: cx-agentcrew-ollama-models
  qdrant-data:
    name: cx-agentcrew-qdrant-data
  assistant-data:
    name: cx-agentcrew-assistant-data
networks:
  codexsun-network:
    external: true
    name: codexsun-network
