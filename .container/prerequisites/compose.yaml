name: codexsun-prerequisites

services:
  mariadb:
    image: ${PREREQUISITE_MARIADB_IMAGE:-mariadb}:${PREREQUISITE_MARIADB_TAG:-11.8}
    container_name: orship-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: orship_master
      MARIADB_ROOT_PASSWORD: ${PREREQUISITE_MARIADB_ROOT_PASSWORD:?Run setup-prerequisites.sh first}
      MARIADB_USER: ${PREREQUISITE_MARIADB_USER:-orship}
      MARIADB_PASSWORD: ${PREREQUISITE_MARIADB_USER_PASSWORD:?Run setup-prerequisites.sh first}
    labels:
      codexsun.orship.prerequisite: 'true'
    ports:
      - 127.0.0.1:${PREREQUISITE_MARIADB_PORT:-3307}:3306
    volumes:
      - mariadb-data:/var/lib/mysql
    networks: [prerequisites]
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  redis:
    image: ${PREREQUISITE_REDIS_IMAGE:-redis}:${PREREQUISITE_REDIS_TAG:-8.2-alpine}
    container_name: orship-redis
    restart: unless-stopped
    command:
      [
        'sh',
        '-ec',
        'printf "user default off\\nuser %s on >%s ~* &* +@all\\n" "$${REDIS_USER}" "$${REDIS_PASSWORD}" > /tmp/users.acl && exec redis-server --appendonly yes --aclfile /tmp/users.acl',
      ]
    environment:
      REDIS_PASSWORD: ${PREREQUISITE_REDIS_PASSWORD:?Run setup-prerequisites.sh first}
      REDIS_USER: ${PREREQUISITE_REDIS_USER:-orship}
    labels:
      codexsun.orship.prerequisite: 'true'
    ports:
      - 127.0.0.1:${PREREQUISITE_REDIS_PORT:-6379}:6379
    volumes:
      - redis-data:/data
    networks: [prerequisites]
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli --no-auth-warning --user "$${REDIS_USER}" -a "$${REDIS_PASSWORD}" ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 12

  filebrowser:
    build:
      args:
        BASE_IMAGE: ${PREREQUISITE_FILEBROWSER_IMAGE:-filebrowser/filebrowser}
        BASE_TAG: ${PREREQUISITE_FILEBROWSER_TAG:-v2.32.0}
      context: .
      dockerfile: Dockerfile
    image: codexsun/orship-filebrowser:${PREREQUISITE_FILEBROWSER_TAG:-v2.32.0}
    container_name: orship-filebrowser
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/filebrowser-init.sh']
    environment:
      FILEBROWSER_ADMIN_PASSWORD: ${PREREQUISITE_FILEBROWSER_ADMIN_PASSWORD:?Run setup-prerequisites.sh first}
      FILEBROWSER_ADMIN_USER: ${PREREQUISITE_FILEBROWSER_ADMIN_USER:-admin}
    labels:
      codexsun.orship.prerequisite: 'true'
    ports:
      - 127.0.0.1:${PREREQUISITE_FILEBROWSER_PORT:-7090}:80
    volumes:
      - filebrowser-data:/srv
      - filebrowser-db:/database
      - ./filebrowser-init.sh:/scripts/filebrowser-init.sh:ro
    networks: [prerequisites]
    healthcheck:
      test: ['CMD-SHELL', 'test -s /database/filebrowser.db']
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 12

volumes:
  filebrowser-data:
  filebrowser-db:
  mariadb-data:
  redis-data:

networks:
  prerequisites:
    name: ${PREREQUISITE_NETWORK_NAME:-codexsun-prerequisites}
