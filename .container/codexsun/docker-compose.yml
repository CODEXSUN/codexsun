name: codexsun

services:
  codexsun-api:
    build:
      context: ../..
      dockerfile: .container/codexsun/Dockerfile
      target: api
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:?required}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:?required}
        PLATFORM_API_PORT: ${PLATFORM_API_PORT:?required}
    image: codexsun/api:${CODEXSUN_VERSION:?required}
    container_name: codexsun-api
    restart: unless-stopped
    env_file: ../deploy.env
    volumes:
      - codexsun-data:/storage
      - cxapp-media-data:/storage/media
    networks:
      cxapp-network: {}
    ports:
      - "127.0.0.1:${PLATFORM_API_PORT}:${PLATFORM_API_PORT}"

  codexsun-web:
    build:
      context: ../..
      dockerfile: .container/codexsun/Dockerfile
      target: web
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:?required}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:?required}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:?required}
    image: codexsun/web:${CODEXSUN_VERSION:?required}
    container_name: codexsun-web
    restart: unless-stopped
    environment:
      PLATFORM_API_PORT: ${PLATFORM_API_PORT:?required}
    depends_on:
      codexsun-api:
        condition: service_healthy
    networks:
      cxapp-network:
        aliases: [cxweb-codexsun-web]
    ports:
      - "127.0.0.1:${PLATFORM_WEB_PORT}:80"

  codexsun-shop:
    build:
      context: ../..
      dockerfile: .container/codexsun/Dockerfile
      target: shop
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:?required}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:?required}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:?required}
    image: codexsun/shop:${CODEXSUN_VERSION:?required}
    container_name: codexsun-shop
    restart: unless-stopped
    environment:
      PLATFORM_API_PORT: ${PLATFORM_API_PORT:?required}
    depends_on:
      codexsun-api:
        condition: service_healthy
    networks:
      cxapp-network:
        aliases: [cxshop-web]
    ports:
      - "127.0.0.1:${CODEXSUN_SHOP_PORT:?required}:80"

volumes:
  codexsun-data:
    name: codexsun-data
  cxapp-media-data:
    external: true

networks:
  cxapp-network:
    external: true
