server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header Permissions-Policy "unload=*" always;

  location = /health { access_log off; return 200 "ok\n"; }
  location ^~ /api/app/ { proxy_pass http://codexsun-api:${PLATFORM_API_PORT}/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location ^~ /api/platform/ { proxy_pass http://codexsun-api:${PLATFORM_API_PORT}/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location / { try_files $uri $uri/ /index.html; }
  location ^~ /assets/ { expires 1y; add_header Cache-Control "public, immutable" always; try_files $uri =404; }
}
