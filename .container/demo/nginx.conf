map $http_x_forwarded_proto $demo_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $http_upgrade $codexsun_connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/app/ {
    proxy_pass http://platform-api:${PLATFORM_API_PORT}/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $codexsun_connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
  }

  location = /api/app {
    return 308 /api/app/;
  }

  # These DevKits own their /api prefix; preserve it at the upstream.
  location ~ ^/api/(data-migration|data-bridge)(/|$) {
    proxy_pass http://platform-api:${PLATFORM_API_PORT};
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $demo_forwarded_proto;
  }

  location ^~ /qcafe/ {
    alias /usr/share/nginx/qcafe/;
    try_files $uri $uri/ /qcafe/index.html;
  }

  location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
